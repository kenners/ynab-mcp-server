name: Build MCPB

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Read version from manifest
        id: version
        run: echo "version=$(jq -r .version manifest.json)" >> "$GITHUB_OUTPUT"

      - name: Validate manifest
        run: npx -y @anthropic-ai/mcpb validate manifest.json

      - name: Pack bundle
        run: |
          mkdir -p dist
          npx -y @anthropic-ai/mcpb pack . "dist/ynab-mcp-server-${{ steps.version.outputs.version }}.mcpb"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ynab-mcp-server-${{ steps.version.outputs.version }}
          path: dist/*.mcpb
          if-no-files-found: error

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1 \
            && gh release upload "${GITHUB_REF_NAME}" dist/*.mcpb --clobber \
            || gh release create "${GITHUB_REF_NAME}" dist/*.mcpb --generate-notes
